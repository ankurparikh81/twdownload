<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>twdownload</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="header-brand">
        <svg class="header-logo" viewBox="0 0 128 128" width="22" height="22">
          <rect x="8" y="8" width="112" height="112" rx="30" fill="#0f1419" stroke="#1d9bf0" stroke-width="8"/>
          <rect x="56" y="32" width="16" height="38" rx="4" fill="#ffffff"/>
          <polygon points="64,88 38,62 90,62" fill="#1d9bf0"/>
          <rect x="36" y="98" width="56" height="10" rx="5" fill="#ffffff"/>
        </svg>
        <div class="header-titles">
          <span class="brand-name">twdownload</span>
          <span class="brand-tag">X / Twitter</span>
        </div>
      </div>
      <div class="header-actions">
        <button id="btn-toggle-input" class="icon-btn" title="Enter or paste another Tweet URL">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- URL Input Section (collapsible/expandable) -->
    <section id="input-section" class="input-section">
      <div class="input-wrapper">
        <input 
          type="text" 
          id="tweet-url-input" 
          placeholder="Paste Tweet URL or Status ID..." 
          autocomplete="off" 
          spellcheck="false"
        />
        <button id="btn-paste" class="input-action-btn" title="Paste from Clipboard">Paste</button>
        <button id="btn-fetch" class="input-action-btn primary" title="Fetch media">Go</button>
      </div>
    </section>

    <!-- Main Content Area -->
    <main class="content-area">
      <!-- Loading State -->
      <div id="state-loading" class="state-panel hidden">
        <div class="spinner"></div>
        <p id="loading-msg" class="state-text">Detecting media in tweet...</p>
      </div>

      <!-- Error State -->
      <div id="state-error" class="state-panel hidden">
        <div class="error-icon">
          <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="#f4212e" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <line x1="12" y1="8" x2="12" y2="12"/>
            <line x1="12" y1="16" x2="12.01" y2="16"/>
          </svg>
        </div>
        <p id="error-msg" class="error-text">No media found.</p>
        <button id="btn-retry" class="secondary-btn">Try Another URL</button>
      </div>

      <!-- Empty / Idle State -->
      <div id="state-idle" class="state-panel hidden">
        <div class="idle-illustration">
          <svg viewBox="0 0 24 24" width="36" height="36" fill="none" stroke="#71767b" stroke-width="1.5">
            <path d="M23 3a10.9 10.9 0 0 1-3.14 1.53 4.48 4.48 0 0 0-7.86 3v1A10.66 10.66 0 0 1 3 4s-4 9 5 13a11.64 11.64 0 0 1-7 2c9 5 20 0 20-11.5a4.5 4.5 0 0 0-.08-.83A7.72 7.72 0 0 0 23 3z"/>
          </svg>
        </div>
        <h3 class="idle-title">No Tweet Detected</h3>
        <p class="idle-desc">Navigate to a post on <strong>x.com</strong> or paste a tweet URL above to download videos or photos.</p>
      </div>

      <!-- Media Result State -->
      <div id="state-result" class="state-panel hidden">
        <!-- Author Info Card -->
        <div class="tweet-card">
          <div class="author-row">
            <img id="author-avatar" class="author-avatar" src="" alt="Avatar" />
            <div class="author-meta">
              <span id="author-name" class="author-name"></span>
              <span id="author-handle" class="author-handle"></span>
            </div>
            <a id="tweet-link" class="tweet-ext-link" href="#" target="_blank" title="Open Tweet on X">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
                <polyline points="15 3 21 3 21 9"/>
                <line x1="10" y1="14" x2="21" y2="3"/>
              </svg>
            </a>
          </div>
          <p id="tweet-text" class="tweet-text"></p>
        </div>

        <!-- Multi-item Tabs (if multiple items) -->
        <div id="media-tabs-bar" class="media-tabs-bar hidden"></div>

        <!-- Media Preview Box -->
        <div class="media-preview-box">
          <div id="preview-container" class="preview-container">
            <!-- Dynamic img or video poster -->
            <img id="media-poster" class="media-poster" src="" alt="Preview" />
            <div id="media-type-badge" class="media-badge">VIDEO</div>
            <div id="media-duration-badge" class="media-badge duration-badge hidden">0:00</div>
          </div>
        </div>

        <!-- Resolution Selector (for Video) -->
        <div id="resolution-section" class="resolution-section">
          <div class="section-label-row">
            <label class="section-label">Available Resolutions</label>
            <span id="resolution-count" class="badge-count">3 options</span>
          </div>

          <div id="resolution-options" class="resolution-options">
            <!-- Dynamic resolution items inserted by JS -->
          </div>
        </div>

        <!-- Download Action Area -->
        <div class="action-area">
          <button id="btn-download" class="download-btn">
            <svg class="download-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="7 10 12 15 17 10"/>
              <line x1="12" y1="15" x2="12" y2="3"/>
            </svg>
            <span id="download-btn-text">Download Video</span>
          </button>
          
          <div id="download-status" class="download-status hidden">
            <span id="status-text">Starting download...</span>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="extractor.js"></script>
  <script src="popup.js"></script>
</body>
</html>
